<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Shalu Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo">Shalu Selection <span>Textiles</span></a>
    <nav class="links">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="shop.html" data-page="shop.html">Shop</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
      <a href="cart.html" data-page="cart.html" class="cart-btn">🛍 Cart <span class="cart-count">0</span></a>
      <div id="authArea" class="auth-area"></div>
    </nav>
  </div>
</header>

<main>
  <section style="padding-top:40px;" id="cartSection"></section>
</main>

<footer>
  <div class="foot-wrap">
    <div>
      <div class="logo" style="color:var(--marigold);font-size:1.3rem;">Shalu Selection</div>
      <p style="max-width:280px;font-size:.85rem;opacity:.8;margin-top:10px;">Handpicked sarees, kurtis, dress materials and lehengas — colour and craft, brought to your doorstep.</p>
    </div>
    <div class="foot-cols">
      <div>
        <h4>Explore</h4>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </div>
      <div>
        <h4>Store</h4>
        <a href="admin.html">Admin Panel</a>
        <a href="cart.html">My Cart</a>
      </div>
    </div>
  </div>
  <div class="foot-bottom">© 2026 Shalu Selection. Made with colour, for everyone.</div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  async function renderCartPage() {
    const section = document.getElementById("cartSection");
    section.innerHTML = `<div class="loading-row">Loading your cart…</div>`;
    const cart = getCart();
    const products = await getProducts();
    const items = Object.entries(cart)
      .map(([id, qty]) => {
        const p = products.find((x) => x.id === id);
        return p ? { ...p, qty } : null;
      })
      .filter(Boolean);
    const total = items.reduce((sum, i) => sum + i.price * i.qty, 0);

    if (!items.length) {
      section.innerHTML = `<div class="empty"><div class="big">🛍</div>Your cart is empty.<br><a href="shop.html" class="btn small teal" style="margin-top:14px;">Start Shopping</a></div>`;
      return;
    }

    const waMessage = encodeURIComponent(
      "Hi Shalu Selection! I'd like to order:\n" +
      items.map((i) => `- ${i.name} x${i.qty} (${money(i.price * i.qty)})`).join("\n") +
      `\nTotal: ${money(total)}`
    );

    section.innerHTML = `
      <div class="section-head" style="margin-bottom:24px;">
        <div class="eyebrow">Your Selection</div>
        <h2>Cart</h2>
      </div>
      <div class="detail-grid" style="align-items:start;">
        <div>
          ${items.map((i) => `
            <div class="cart-item">
              <img src="${i.img}" alt="${escapeHtml(i.name)}">
              <div class="meta">
                <b>${escapeHtml(i.name)}</b>
                <div style="font-size:.82rem;color:rgba(58,18,32,0.6);">${escapeHtml(i.category)}</div>
                <div class="price">${money(i.price)} × ${i.qty}</div>
              </div>
              <button class="btn small outline" data-remove="${i.id}">Remove</button>
            </div>
          `).join("")}
        </div>
        <div class="cart-summary">
          <div class="row-between"><span>Subtotal</span><b>${money(total)}</b></div>
          <div class="row-between" style="font-size:.82rem;color:rgba(58,18,32,0.6);"><span>Delivery</span><span>Discussed on order</span></div>
          <hr style="border:none;border-top:1px solid var(--line);margin:6px 0;">
          <div class="row-between" style="font-size:1.15rem;"><span>Total</span><b>${money(total)}</b></div>
          <a href="https://wa.me/910000000000?text=${waMessage}" target="_blank" class="btn teal" style="justify-content:center;margin-top:8px;">Order via WhatsApp</a>
          <p style="font-size:.78rem;color:rgba(58,18,32,0.55);text-align:center;">We confirm every order personally before dispatch.</p>
          ${getGoogleUser() ? `<p class="cart-sync-note">☁️ Saved to your account — safe across devices.</p>` : `<p class="cart-sync-note">Sign in with Google (top right) to save this cart for next time.</p>`}
        </div>
      </div>
    `;

    section.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        removeFromCart(e.currentTarget.dataset.remove);
        showToast("Removed from cart");
        renderCartPage();
      });
    });
  }

  renderCartPage();
  document.addEventListener("shalu:cartSynced", renderCartPage);
</script>
</body>
</html>
